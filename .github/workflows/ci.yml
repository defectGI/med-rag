name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: Python quality gate (ruff + import contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra parse --extra serve --extra dev
      - name: Ruff check (main packages)
        run: uv run ruff check src tools
      - name: Layer-contract tests
        run: uv run python -m pytest src/medrag/tests/test_import_contracts.py -q

      # The full offline pytest suite exists but several dormant-path tests
      # (doc_download/comparison/factory, nightly_report) carry pre-existing
      # failures on a clean checkout because they require `facts/db/specs.db`
      # or a local model endpoint (see PLAN.md). The gate above checks the
      # architectural contracts and lint; run the full suite locally with:
      #   pytest src/ tools/ -q
      # and treat changes that add NEW failures (vs. the documented baseline)
      # as regressions.

  frontier:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
