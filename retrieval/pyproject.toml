[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# STALE: code moved to `src/medrag/api/retrieval/`, so the
# `[tool.setuptools.packages.find] where=["src"]` below now points at an empty
# tree (`retrieval/src/` no longer exists). Updating this file is the job of
# the root `pyproject.toml` `serve` extra path-dep handling. Do not install
# from this directory.
#
# Distribution name on PyPI. The IMPORT name stays `retrieval`:
#     pip install mkd-retriever   ->   import retrieval
name = "mkd-retriever"
version = "0.5.0"
description = "Modular, project-agnostic RAG retrieval layer: independent retrieval strategies behind a small shared core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mehmet Kaan Durupunar" }]
keywords = [
    "rag",
    "retrieval",
    "information-retrieval",
    "intent-classification",
    "text-to-sql",
    "llm",
    "nlp",
    "modular",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    # Kept minimal on purpose: only what core/ + eval/ (the shared surface every
    # install pulls in) ACTUALLY import. Anything a specific retrieval method
    # needs goes into that method's own extra below, never here.
    #
    # NOTE on langchain-core: it is intentionally NOT here. core/ and eval/ do
    # not import it today (only intent_classification does), so forcing it on a
    # consumer who installs just [db_query] would violate dependency minimalism
    # (ARCHITECTURE.md #8). When core/ grows the shared Embeddings/VectorStore
    # abstraction and actually imports langchain-core, move it up here -- one
    # line -- and it becomes a true base dependency then.
    "pydantic>=2",
    "python-dotenv>=1",
]

# Each retrieval method is an installable extra. A consumer (or a dev working
# on one method) installs only what that method needs:
#   pip install "mkd-retriever[intent_classification]"
#   pip install "mkd-retriever[db_query]"
# No extra should ever depend on another extra — that dependency belongs in
# `dependencies` above (shared/core) instead, or the boundary is wrong.
[project.optional-dependencies]
top_n = [
    # Search-only client against an existing Qdrant collection (this module
    # never builds one). The embedder is stdlib urllib (OpenAICompatEmbedder),
    # no extra HTTP dependency needed for that half.
    "qdrant-client>=1.12,<2",
]
query_rewriting = []
intent_classification = [
    # This is the only module that imports langchain-core, so it declares it
    # here rather than in base deps (ARCHITECTURE.md #8). langchain-openai wires
    # a remote OpenAI-compatible endpoint (e.g. Ollama /v1) via ChatOpenAI and
    # transitively requires langchain-core; we still list core explicitly to
    # make the contract self-documenting.
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
raptor = []
agentic = []
db_query = [
    # SQL is generated by a 2-stage LLM pipeline (import name:
    # text2sql_native) that produces a SQL string and never touches a DB. We
    # run that SQL locally with the stdlib sqlite3 (no dep). The [openai]
    # extra pulls the OpenAI SDK to talk to a remote OpenAI-compatible endpoint
    # (e.g. Ollama /v1) -- the only heavy piece, isolated here (ARCHITECTURE.md #3).
    #
    # PINNED, not >=, AND renamed away from "text2sql-engine". A version pin
    # alone ("==0.2.0+ollama1") was not enough: a real PyPI package named
    # "text2sql-engine" exists (the fork author's older, unmaintained public
    # release) that provides the SAME import name (`text2sql`), so any install
    # step naming the old distribution could silently shadow this fork. The
    # vendored fork was renamed to distribution "text2sql-engine-native" /
    # import name `text2sql_native`, making the collision structurally
    # impossible -- nothing on PyPI has ever published under either name.
    # Consuming projects must install `packages/text2sql-native` (editable)
    # themselves -- see that package's pyproject.toml for how the reference
    # consumer wires it as a path dependency. retrieval itself stays
    # independent of any specific consumer's vendored path (only the
    # distribution NAME + version STRING are pinned here, not a path). Bump
    # this pin only together with a verified, actually-committed release and
    # a matching prompt update.
    "text2sql-engine-native[openai]==1.0.0",
]
eval = []

# Everything the implemented modules need, in one shot.
all = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "text2sql-engine-native[openai]==1.0.0",
    "qdrant-client>=1.12,<2",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1",
    "twine>=5",
]

[project.urls]
Homepage = "https://pypi.org/project/mkd-retriever/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type-checkers see this as a typed package.
"retrieval" = ["py.typed"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU/inference rule: the default run never touches a real endpoint.
# Integration tests that hit a live inference endpoint are marked `integration`
# and skipped by default -- run them only on the GPU machine with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: hits a real inference endpoint; run only on the GPU machine",
]

[tool.ruff]
line-length = 100
src = ["src"]
