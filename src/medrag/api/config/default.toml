# chatbot tuning varsayılanları (kök CONFIG.md: tuning burada, bağlantı/sır
# .env'de). Bilinmeyen anahtar reddedilir, eksik anahtar yüksek sesle patlar
# (chunker/vectorize ile aynı yükleyici deseni, bkz. chatbot/chatbot/config.py).

[routing]
# Bir intent burada listelenmiyorsa bu flow'a düşer. Deterministik eşleme
# (karar: 2026-07-22) -- asıl konuşan model kendi stratejisini çalışma
# zamanında seçmez; yeni bir yol eklemek bu tabloya bir satır eklemek + yeni
# bir Flow yazmaktan ibarettir, mevcut flow'lara dokunulmaz.
default_flow = "default_topn"

[routing.intents]
# med-rag (PLAN.md C5): neredeyse her şey tek vektör yoluna (default_topn)
# düşer -- yapılandırılmış spec yolu (sql_topn) bu fork'ta KAPALI, kodu
# duruyor ama tablodan koparıldı. out_of_scope/quote_or_contact retrieval
# gerektirmez (no_retrieval). doc_download specs.db'nin document
# tablosuna bağlı olduğundan dormanttir; belge indirme UI'nin kütüphane
# API'sinden yapılır (medrag.api.library).
product_fact = "default_topn"
visual_request = "default_topn"
doc_download = "default_topn"
aggregation = "default_topn"
comparison = "default_topn"
out_of_scope = "no_retrieval"
quote_or_contact = "no_retrieval"
recommendation = "default_topn"


[flow]
# Her retrieval çağrısına (top_n / db_query) istenen sonuç sayısı.
# `top_n_k`: yalnızca `default_topn` flow'u (doc_question gibi SQL'siz saf
# top_n akışı) kullanır.
top_n_k = 10
# `sql_k`: `sql_topn` flow'unun (product_fact/aggregation/visual_request) SQL
# satır sayısı üst sınırı. db_query şart-uyan satırların TAMAMINI çeker
# (SQL'de LIMIT yok), bu Python tarafında yalnızca `results[:k]` ile kırpılan
# üst sınır (bkz. retrieval db_query/retriever.py::retrieve) -- kullanıcı
# "50 ürün var ama 10'u görülüyor" diye bildirdi, 300'e çıkarıldı (karar:
# 2026-07-27).
sql_k = 300
# `sql_topn_k`: AYNI `sql_topn` flow'unun top_n (chunk/RAG) çağrıları için AYRI
# bir üst sınır (karar: 2026-07-27) -- önceden `sql_k` ile PAYLAŞILIYORDU,
# `sql_k`'yi büyütmek istemeden top_n context boyutunu/token maliyetini de
# büyütüyordu. `top_n_k`'den bağımsız bir alan -- ikisi de "top_n çağrısına
# istenen sonuç sayısı" ama farklı flow'lara ait.
sql_topn_k = 10

[session]
# L0 oturum görev-durumu (bkz. session_state.py / reconciler.py).
# Bir subject (ürün/entity) kaç turdur değinilmezse aktif odaktan düşer
# (recency-decay, yapışkan bağlama karşı).
decay_window = 6
# Reconciler'ın "amaç hâlâ aktif" güveni bu eşiğin ALTINDAYSA asıl model
# cevabı çerçevelerken teyit istemeye yönlendirilir (hedge).
hedge_confidence_threshold = 0.5
# L1 (reconcile) + L2 (intent classify) TEK küçük-model çağrısında birleşsin mi
# (karar: 2026-07-24). true: reconciler intent'i de döndürür, ayrı classify
# çağrısı (bir tam LLM round-trip) atlanır -- her turda, "selam" gibi trivial
# turlar dahil. Küçük modelin tek çağrıda hem durum takibi hem 9-etiket
# sınıflandırmayı güvenilir yaptığı GPU makinesinde A/B ile ölçülmeli; kalite
# düşerse false yapıp eski iki-çağrılı davranışa dön (kod değişmeden).
fuse_intent = true
# GPU-ağır SQL zinciri (linking gemma4:31b -> generation qwen2.5-coder:32b)
# uygulama genelinde en fazla kaç eşzamanlı çalışsın (bkz. gpu_gate.py). 1 =
# iki büyük model tek 32GB VRAM'de asla yarışmaz (sığmıyorsa thrashing yerine
# düzenli sıra). İki model birlikte VRAM'e sığdırılabiliyorsa 2 yapıp gerçek
# batch paralelliği (ör. comparison'ın iki tarafı) denenebilir.
sql_concurrency = 1
# Tek bir SQL retrieval çağrısı bu süreyi (saniye) aşarsa SqlGateTimeout
# fırlar, semafor hemen serbest kalır -- bir hata/donma sınıfının TÜM diğer
# SQL-tabanlı kullanıcıları süresiz kilitlemesini önlemek için (karar:
# 2026-08-05, kullanıcı: "sql hatalarında servisi durdurmamalı", bkz.
# gpu_gate.py::SerializedRetriever). Legit en-kötü-durum tek istek (linking
# 180s + generation retry×3×300s, text2sql/config.toml) ~1080s sürebilir --
# 1500 bunun belirgin üzerinde, normal yavaşlığı kesmez.
sql_gate_timeout_seconds = 1500

[result_shape]
# `FlowContext.result_shape` eşiği (ROADMAP 14c, bkz. chatbot/AGENTS.md
# "Mimari kurallar" DÜZELTME 2026-07-29) -- 0 sonuç -> "zero", 1 sonuç ->
# "one", 2..few_max sonuç -> "few", few_max'ın üstü -> "many". Bu YALNIZCA
# yanıt FORMUNU şekillendiren kapalı kümeli bir sinyaldir (asıl konuşan
# modele `FlowContext.results` + strateji promptu YANINDA kısa bir not olarak
# gider, bkz. answering_model.py::_result_signal_note) -- flow MANTIĞINI
# etkilemez, hangi satırların döndüğünü değiştirmez.
few_max = 5

[visual]
# Görsel görünürlük süzgeci (ROADMAP 10d) -- chunker/parser'ın `[visual]
# exclude_types` ilkesiyle AYNI prensip (bkz. chunker/config/default.toml
# [visual], kök CONFIG.md): top_n metadata'sındaki `images` alanından
# (bkz. vectorize/cli.py::_node_payload) burada listelenen `visual_type`
# değerleri kullanıcıya AYRI görsel kanalında hiç gösterilmez (bkz.
# answering_model.py::extract_visible_images). Chunker'ın kendi
# exclude_types'ından BAĞIMSIZ bir katman -- o chunk METNİNE girişi süzer,
# bu KULLANICIYA structured gösterimi süzer. Boş liste = hiçbir tip
# dışlanmaz (varsayılan: hepsi gösterilir; tip bilinmiyorsa/yoksa da
# şüphede dahil et ilkesiyle gösterilir).
# ANA SALTER: false iken gorsel kanali TAMAMEN kapanir (arayuz hic gorsel
# basmaz). exclude_types tip-bazlidir ve "tip bilinmiyorsa GOSTER" ilkesiyle
# calisir -- tum tipleri saysaniz bile tipsiz gorseller sizar, o yuzden
# kapatmak icin BU alan kullanilir. Crop blob store'u bu deployment'ta yoksa
# (parser'in STORAGE_IMAGES_DIR'i tasinmis/silinmis) false yapin: aksi halde
# arayuz kirik gorsel ikonlari basar.
# VARSAYILAN false YAPILDI (2026-08-07, kullanici karari): crop blob store bu
# deployment'ta kayip/erisilemez oldugu icin cevaba gorsel basilmasi istenmedi.
# `CHATBOT_IMAGE_STORAGE_DIR` dogru bir mutlak yola isaret ettiginde tekrar
# `true` yapilip acikca geri acilir.
enabled = false
exclude_types = []

[logging]
# Kalıcı dosya loglaması (bkz. chatbot/chatbot/logging_setup.py). webapp
# başlarken kurulur; her arka plan aşaması (özellikle SQL zinciri) chatbot/
# logs/chatbot.log'a yazılır. Kör hata tahmini için değil, GERÇEK log için.
#
# level: kök + chatbot.* + Flask/werkzeug/urllib. Sorgu metni INFO'da, SQL
# HATALARI ERROR'da loglanır -- gizlilik için WARNING yaparsan sorgular gizlenir
# ama hatalar görünmeye devam eder. CHATBOT_LOG_LEVEL env'i bunu ezer.
level = "INFO"
# text2sql (SQL linking/generation) için AYRI seviye. Öncelik SQL olduğundan
# DEBUG: ara modelin her isteği/uyarısı/geri-düşüşü diske düşsün.
text2sql_level = "DEBUG"
# Dönen dosya: 5 MB'ta bir döner, 5 yedek tutulur (~30 MB tavan).
max_bytes = 5000000
backup_count = 5
# Dosyaya ek olarak stderr'e de yaz (webapp'i terminalde izlerken canlı akış).
console = true

[conversation_log]
# Konuşma başına AYRINTILI kayıt (bkz. chatbot/chatbot/conversation_log.py,
# karar: 2026-07-27, genişletme: 2026-08-06) -- yukarıdaki [logging]'den AYRI
# bir kanal: [logging] hata ayıklama içindir (tüm oturumlar TEK metin
# dosyasında karışık), burası her konuşmayı KENDİ klasöründe tutar:
#   <dir>/<kanal>/<konusma_id>/{meta.json, turns.jsonl, conversation.log}
# <kanal> = web (webapp) | whatsapp (wa_bot); <konusma_id> WhatsApp'ta
# KULLANICI NUMARASIDIR -- yeni bir numaradan ilk mesaj klasörünü açar.
# webapp'in `/api/chat` + `/api/chat/stream` ve wa_bot'un `/mesaj` yolları
# ikisi de yazar.
enabled = true
# Bileşen köküne (`chatbot/`) göre relatif.
dir = "logs/conversations"
# O tur boyunca `logging` üzerinden akan HER arka plan satırı (chatbot.* +
# text2sql'in SQL linking/generation ayrıntısı, `asyncio.to_thread`teki LLM
# çağrıları dahil) konuşmanın KENDİ conversation.log'una da yönlensin mi
# (karar: 2026-08-06, kullanıcı: "her konuşma ayrı tutulacak ve o konuşma
# içerisindeki hem mesajlar hem de tüm arkaplan aşamaları logları tutulacak").
# Not: bir satırın buraya düşmesi için [logging] level'dan geçmesi gerekir --
# chunk listeleri gibi DEBUG satırları ancak level = "DEBUG" iken girer
# (yapısal turns.jsonl'deki `trace` ise seviyeden bağımsız olarak tamdır).
capture_background = true

[answering]
# Cevaplama rolünün ÇIKTI SÖZLEŞMESİ (karar: 2026-08-05, bkz. chatbot/chatbot/
# reply_contract.py). Canlı test bulgusu #1/#2/#5'in kök sebebi: bu depodaki her
# LLM rolünün çıktısı doğrulanırken (reconciler ilk {...} bloğunu alır,
# sqlretrieve bozuk JSON'da escalation'a girer) cevaplama rolü ham
# `message.content`i doğrudan döndürüyordu -- ve o string kullanıcıya, hafızaya
# VE (hafıza üzerinden) reconciler'ın prompt'una birden gidiyordu, yani tek bir
# bozuk tur oturum-ömürlü bir arızaya dönüşüyordu.
#
# contract: model artık `{"reply": ..., "cited": [...]}` zarfı döner; zarfın
# DIŞINDA kalan muhakeme/taslak/harmony işaretleri ayrıştırmada yapısal olarak
# düşer. false = 2026-08-05 öncesi ham davranış (ACİL kaçış kapağı -- küçük
# model zarfı hiç tutturamıyorsa geçici olarak kapatılır).
contract = true
# Sözleşme ihlalinde (zarf yok ya da dejenere tekrar-döngüsü) kaç EK deneme.
# Her deneme bir tam LLM round-trip'i, bu yüzden düşük: 1. Tükenirse kurtarılan
# metne, o da yoksa kısa bir Türkçe kanı cevaba düşülür (turu ASLA düşürmez).
retries = 1

[preamble]
# Ön-bilgilendirme balonları (karar: 2026-08-06, bkz. chatbot/chatbot/
# preamble.py). Ölçüm (logs/conversations `timing` olayları, 10 tur): `sql`
# aşaması ortalama 18.5 sn, tam tur ortalama 14.6 sn, en kötü 32.6 sn. webapp'te
# canlı trace paneli bu bekleyişi görünür kılıyor, WhatsApp'ta kullanıcı HİÇBİR
# ŞEY görmüyor -- balon o boşluğu doldurur.
#
# TAMAMEN DETERMİNİSTİK: ek bir LLM çağrısı YOKTUR. Metinler TR/EN havuzlardan
# (birden fazla varyant, rastgele) seçilir, dil kullanıcının mesajından saf
# kodla saptanır; seçilen cümlenin hangi havuzdan geldiği `pool` alanıyla
# konuşma kaydına düşer.
#
# ŞU AN KAPALI (karar: 2026-08-06, kullanıcı: "şimdilik toggle off gibi bu
# mekanizmayı kapatalım, demoya az kaldı, ben bunun üstünde sonra
# çalışacağım"). KOD OLDUĞU GİBİ DURUYOR ve testleriyle birlikte yeşil --
# `enabled = true` yapmak özelliği hiçbir kod değişikliği olmadan geri
# açar. `false` iken `factory.py::preamble_settings_from_config` her kanal
# için `None` döner, `Orchestrator` hiç balon üretmez: davranış 2026-08-06
# öncesiyle BİREBİR aynıdır (hiçbir sıcak yol etkilenmez).
enabled = false
# Balon hangi kanallarda basılsın (web = webapp sohbet balonu, whatsapp =
# gateway üzerinden AYRI bir mesaj). Listeden bir kanalı çıkarmak o servisi
# 2026-08-06 öncesi davranışa döndürür. (`enabled = false` iken bu liste
# okunmaz.)
channels = ["web", "whatsapp"]
# Tur bu süreyi (saniye) aşarsa İKİNCİ, "hâlâ üzerinde çalışıyorum" balonu
# basılır -- o an hangi flow'da olduğumuz bilindiğinden daha isabetli bir
# havuzdan. Kısa turlarda watchdog iptal edilir, ikinci balon HİÇ basılmaz
# (WhatsApp'ta balon spam'i olmasın). 0 = watchdog kapalı.
# 12: ölçülen tur ortalamasının (14.6) hemen altında -- ortalamadan yavaş
# turlar ikinci balonu görür, hızlılar görmez.
watchdog_seconds = 12.0
# t≈0'da bu flow'lardan birine gideceğimizi BİLİYORSAK ERKEN balon basılmaz.
# Bu yalnız pinlenmiş/handoff turlarda bilinir (tam pipeline'da flow intent'ten
# SONRA belli olur) -- ölçülen süreler: no_retrieval retrieval'a hiç gitmez,
# doc_download deterministik tek SQL, default_topn top_n ~1.5 sn.
# ÖNEMLİ: bu susturma WATCHDOG'U KAPSAMAZ. Liste bir TAHMİNDİR; watchdog o
# tahminin tutmadığını yakalayan güvenlik ağıdır -- buradaki bir flow yine de
# watchdog_seconds'ı aşarsa balon basılır (o tur için kullanıcının gördüğü İLK
# mesaj olur). Aksi hâlde sessizliğin en uzun olduğu yerde susmuş olurduk.
fast_flows = ["no_retrieval", "doc_download", "default_topn"]

[evidence]
# Cevabın altındaki katlanır "Kanıt (N)" paneli (webapp.py::addEvidence).
# [DOC] satırları zaten chunk metnini taşır; bu tablo [SQL] satırlarının
# ARKASINDAKİ chunk metnini çözen ek katmanı ayarlar (karar: 2026-08-07,
# PROTOCOL KARAR-069, bkz. chatbot/chatbot/sql_evidence.py).
#
# Zincir: spec_value.value_id -> source_chunk_id/evidence (işaretçi, specs.db)
#         -> chunk metni (chunker/storage/all_chunks.json, chunk_store.py)
#         -> document.file_path (specs.db `document` tablosu)
# false = 2026-08-07 öncesi davranış; specs.db/chunk korpusu HİÇ okunmaz,
# [SQL] satırları yalnız kolon/değer tablosu olarak gösterilir.
sql_chunks = true
# Bir SQL satırının altında en fazla kaç kanıt chunk'ı listelenir
# (tekilleştirmeden SONRA). `spec_value.evidence` bazı satırlarda onlarca
# doğrulayıcı kaynak taşıyor -- hepsi basılırsa panel okunmaz olur.
max_chunks_per_row = 8
# Kanıt chunk metninin kırpma sınırı (karakter). `extract_evidence_chunks`in
# kendi 280'lik `snippet_len`inden BÜYÜK, çünkü orada amaç ÖNİZLEME, burada
# metni gerçekten OKUTMAK.
snippet_len = 1200

[queue]
# Redis + RQ kuyruğu (Grup G, S-02) -- I-03 (aynı mesaj iki kez teslim
# edilirse iş bir kez çalışır) + I-04 (kabul edilen iş süreç ölse de
# kaybolmaz). Bağlantı adresi (REDIS_URL) BİLİNÇLİ olarak burada DEĞİL --
# kök CONFIG.md deseni: tuning burada, bağlantı .env'de.
#
# `wa_bot.py`'nin enqueue ettiği, `worker/main.py`'nin dinlediği kuyruk adı.
wa_queue_name = "wa-mesaj"
# Bir job bu süreyi (saniye) aşarsa RQ zorla düşürür. `session.
# sql_gate_timeout_seconds` (1500s, en-kötü-durum tek SQL zinciri) ÜZERİNE
# pay bırakılmış -- normal yavaş bir tur bu tavana çarpmasın.
job_timeout_seconds = 1800
# Job worker'da beklenmeyen bir ALTYAPI istisnasıyla düşerse (Redis kopması,
# bundle kurulumu patlaması -- `_isle` orchestrator hatalarını KENDİSİ
# yakalayıp kullanıcıya cevap gönderir, bu sayaç onları kapsamaz) kaç kez
# yeniden denenir (S-06 kararı).
job_max_retries = 3
# Yeniden denemeler arası bekleme (saniye) -- artan aralık, geçici bir
# kopmanın (örn. Redis yeniden başlıyor) kendini çözmesine zaman bırakır.
job_retry_interval_seconds = [30, 120, 300]
# `mesaj_id` idempotency anahtarının Redis'te canlı kalma süresi (saniye).
# wa-gateway'in KENDİ dedup'ı (`_TEKRAR`) süreç-lokal ve restart'ta sıfırlanır;
# bu TTL bot tarafında AYRI, kalıcı bir ikinci katman (I-03). 24 saat --
# WA_BOT_SESSION_TTL_HOURS ile aynı büyüklük mertebesi, tekrar gönderimlerin
# gerçekçi üst sınırı.
idempotency_ttl_seconds = 86400
