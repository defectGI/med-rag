# core/config — çapraz-bileşen (cross-cutting) tuning iskeleti (D-51).
#
# NE DEĞİL: bu dosya `parser/config/default.toml`, `chunker/config/default.toml`,
# `vectorize/config/default.toml`, `api/config/default.toml`'ın YERİNE GEÇMEZ ve
# onları BİRLEŞTİRMEZ. CONFIG.md'nin "her bileşen kendi config/default.toml'unu
# taşır, paylaşılan config paketi yok" kuralı hâlâ geçerli — bileşenler bilinçli
# olarak birbirini import etmiyor, tek bir dev TOML bu izolasyonu bozardı.
#
# NE: `ANALYSIS.md` §2.5'in bulduğu, HİÇBİR bileşenin kendi config/default.toml'unda
# evi olmayan ayarlar — ya çıplak `os.getenv(...)` fallback'i ya da kod içi
# literal. D-56 ("tek okuma noktası: os.getenv yalnızca core/config/ içinde")
# öncesi bunları TEK yerde görünür/tartışılabilir kılmak için yazıldı.
#
# Bu tur (D-51) yalnız İSKELET: değerler bugünkü kod-içi/env fallback'lerin
# birebir kopyası, kod bu dosyayı henüz OKUMUYOR (loader D-52/D-56'nın işi).
# Amaç kaybolmuş ayar envanterini tek yere toplamak, davranışı değiştirmek değil.
#
# BİLİNÇLİ MUAF: `parser/parsers/pdf_parser.py` ve kardeşlerindeki geometri/eşik
# sabitleri (K-56/D-57 kararı, bu turda dokunulmuyor) — buraya alınmadı.

[retrieval]
# `src/medrag/api/retrieval/` bugün HİÇ TOML yükleyicisi taşımıyor — her modül
# kendi `os.getenv(...)` fallback'ini satırında tutuyor (CONFIG.md'nin
# "retrieval'ın hiç TOML yükleyicisi yok" notuyla tutarlı, ANALYSIS.md §2.5).
# Kaynak: modules/intent_classification/factory.py, modules/top_n/embedder.py.
llm_timeout_seconds = 60
# şimdi: intent_classification/factory.py:86 -> os.getenv("LLM_TIMEOUT", "60")
llm_max_retries = 2
# şimdi: intent_classification/factory.py:87 -> os.getenv("LLM_MAX_RETRIES", "2")
embedder_timeout_seconds = 120.0
# şimdi: modules/top_n/embedder.py:67 -> fonksiyon imzasında sabit varsayılan
# (env'den DEĞİL, doğrudan Python default'u)

[chunking]
# BİLİNÇLİ BOŞ. chunker'ın KENDİ config/default.toml'u zaten tam ve iyi
# yönetiliyor ("bölme davranışını etkileyen hiçbir sayı kodda hardcode
# edilmez" — chunker/config/default.toml'un kendi ilke yorumu). Tarama
# sırasında chunker'a özgü, config/default.toml dışında kalmış bir sayı
# BULUNAMADI. Bu bölüm D-56 sonrası "neden boş" sorusuna önceden cevap
# vermek için duruyor — chunker core/'a taşınırsa yeni değer BURAYA değil
# kendi dosyasına eklenir.

[llm]
# core/llm/ (D-31'de 7 klonun birleştiği ortak OpenAI-uyumlu istemci) bugün
# tek bir hardcoded fallback taşıyor.
ollama_base_url = "http://localhost:11434/v1"
# şimdi: core/llm/providers.py:41 -> COMPAT_DEFAULT_URL["ollama"]
# Not: model/provider/api_key/`*_BASE_URL` seçimi CONFIG.md'nin "bağlantı
# kimliği" türü — `.env`de KALIR, buraya taşınmaz. Burada yalnızca paylaşılan
# istemcinin kod-içi son-çare fallback'i var.

[whatsapp]
# `src/medrag/api/wa_bot.py` — D-10'da `WA_BOT_HOST` eklenirken bırakılan
# `TODO(D-56): core/config'e taşınacak` yorumunun karşılığı. Üçü de bugün
# env-only, TOML'a hiç bağlı değil.
gateway_url = "http://127.0.0.1:8000"
# şimdi: wa_bot.py:76 -> os.environ.get("GATEWAY_ADRES", "http://127.0.0.1:8000")
host = "127.0.0.1"
# şimdi: wa_bot.py:246 -> os.getenv("WA_BOT_HOST", "127.0.0.1")  (D-10)
port = 8003
# şimdi: wa_bot.py:244 -> os.getenv("WA_BOT_PORT", "8003")
gateway_timeout_seconds = 30
# şimdi: wa_bot.py:86 -> urllib.request.urlopen(istek, timeout=30) — çıplak
# literal, env fallback'i bile yok

[logging]
# `api/config/default.toml` (chatbot) KENDİ [logging] bloğunu zaten taşıyor
# (level/text2sql_level/max_bytes/backup_count/console) — TEKRAR EDİLMEDİ.
# Bu bölüm yalnız hâlâ `logging.basicConfig(...)` ile çıplak çalışan iki
# pipeline CLI'sını kapsar; bunlar "davranış" tuning'i değil ama envanterde
# görünür olsun diye buraya yazıldı.
chunker_cli_level = "INFO"
# şimdi: pipeline/chunker/cli.py:332 -> logging.basicConfig(level=logging.INFO, ...)
vectorize_cli_level = "INFO"
# şimdi: pipeline/vectorize/cli.py:240 -> logging.basicConfig(level=logging.INFO, ...)
vectorize_query_level = "WARNING"
# şimdi: pipeline/vectorize/query.py:80 -> logging.basicConfig(level=logging.WARNING, ...)

[parser]
# BİLİNÇLİ NEREDEYSE BOŞ. parser'ın KENDİ config/default.toml'u zaten var
# (max_tokens vb., D-15 ile doğrulandı) — o değerler BURAYA taşınmadı.
# Geometri/eşik sabitleri (pdf_parser.py ve kardeşleri) K-56/D-57 kararıyla
# bu turda BİLİNÇLİ MUAF, buraya da alınmadı.
# Tek somut bulgu: parser tarafının [llm] ile AYNI Ollama base URL'ini
# ayrı dosyalarda kendi kopyasında tutması (duplikasyon, davranış farkı
# değil) — gerçek birleştirme D-52/D-56'nın işi, burada yalnız iz düşülüyor.
# şimdi: pipeline/parser/llm/openai_compat.py, pipeline/parser/llm/__init__.py

[pipeline]
# N-15: gece koşusu (parse + facts, en ağır Ollama tüketicileri) sürerken
# servis cevap vermeye devam etmeli (I-05/I-29) -- Ollama paylaşımlı (K-10).
# İki koruma: (a) pipeline worker'ın Docker/Coolify tarafında **1 replika**
# ile çalıştığını burada SABİTLİYORUZ -- gerçek zorlama compose/Coolify
# servis tanımında (bu makinede yok, N-14 ile birlikte Docker/GPU
# makinesinde uygulanır), bu alan o kararın TEK kaynağı ve dokümantasyonu;
# (b) `ollama_max_concurrent` -- `core/ollama_semaphore.py`nin okuduğu,
# parse/facts'ın Ollama'ya AYNI ANDA gönderebileceği çağrı sayısı tavanı.
worker_replicas = 1
# şimdi: Docker/Coolify compose tanımı bu makinede YOK -- bu alan N-14 ile
# birlikte servis makinesinde `replicas: 1` olarak uygulanacak TEK karar
# kaynağı (kod: bkz. RUNBOOK.md notu, henüz repoda yok).
ollama_max_concurrent = 2
# şimdi: core/ollama_semaphore.py::get_ollama_semaphore() -- parser/facts'ın
# Ollama çağrılarını (henüz kablolanmadı, bkz. modülün docstring'i) bu
# semaforla sarması gereken tavan. Başlangıç değeri 2 (tahmini, K-10'un
# "paylaşımlı" notuyla tutarlı muhafazakar bir başlangıç) -- gerçek 120 sn
# eşiği GPU/servis makinesinde ölçülüp ayarlanmalı.

[pipeline.versions]
# N-13: her aşamanın GÜNCEL sürümü TEK yerde. Gece raporu (N-12,
# `nightly_report.py::derive_status`) bir kaydın `*_version`ını burasıyla
# karşılaştırıp geride kalmışsa "aşama değişti" der. Elle artırılır (kod
# hash'i otomatik alınmaz -- her refactor'da tüm korpusu bayat gösterip
# gürültüde boğardı, bkz. task metni). Aşamanın ÇIKTISINI değiştiren her
# değişiklikte artırılır (prompt, eşik, chunk sınırı, parser geometrisi);
# biçimsel/refactor değişikliklerde artırılmaz.
# İSTİSNA -- embedding modeli: model değişirse vektör boyutu değişebilir
# (D-03: 4096 ölçülmüştü) ve koleksiyonun TAMAMI geçersiz olur; bu durumda
# sürüm artırmak YETMEZ, koleksiyon yeniden kurulur (bkz. RUNBOOK.md).
parser_version = "1.5.0"
# şimdi: pipeline/parser/parsers/base.py -> PARSER_VERSION (tek gerçek kaynak
# hâlâ orada; bu satır N-13'ün "config'de de görünsün" kuralı için ayna)
chunker_version = "1.0.1"
# şimdi: pipeline/chunker/__init__.py -> CHUNKER_VERSION (aynı ayna kuralı)
facts_version = "1.0.0"
# YENİ (N-13) -- facts katmanı O grubuyla dirilene kadar hiç sürümlenmiyordu.
# Başlangıç değeri 1.0.0; O grubunun ürettiği ilk yazıcı bu sürümü kayda
# yazmalı (bkz. nightly_report.py N-12/N-13 notu, kapsam dışı bırakılan iş).
vectorize_version = "1.0.0"
# YENİ (N-13) -- embedding modeli DEĞİL, vectorize AŞAMASININ (payload şekli,
# imza hesaplama mantığı) sürümü. Model değişimi ayrı istisna (yukarı bkz.).
