[parser]
# DELIBERATELY NEARLY EMPTY. The parser already has its OWN config/default.toml
# (max_tokens etc., verified with D-15) — those values were NOT moved here.
# The geometry/threshold constants (pdf_parser.py and siblings) are a DELIBERATE
# EXEMPTION for this round under K-56/D-57, so not included here either.
# The only concrete finding: the parser side keeps the SAME Ollama base URL as
# [llm] in its own copy in separate files (a duplication, not a behavior
# difference) — the real merge is D-52/D-56's job; here only a trace is left.
# now: pipeline/parser/llm/openai_compat.py, pipeline/parser/llm/__init__.py

[pipeline]
# N-15: while the nightly run (parse + facts, the heaviest Ollama consumers) is
# running, the service must keep answering (I-05/I-29) — Ollama is shared (K-10).
# Two guards: (a) we FIX here that the pipeline worker runs as **1 replica** on
# the Docker/Coolify side — the actual enforcement is in the compose/Coolify
# service definition (not on this machine; applied with N-14 on the Docker/GPU
# machine); this field is the SINGLE source and documentation of that decision;
# (b) `ollama_max_concurrent` — the ceiling read by `core/ollama_semaphore.py`,
# the max number of calls parse/facts may send to Ollama AT THE SAME TIME.
worker_replicas = 1
# now: no Docker/Coolify compose definition on this machine — with N-14 this
# field is the SINGLE decision source applied as `replicas: 1` on the service
# machine (code: see the RUNBOOK.md note, not yet in the repo).
ollama_max_concurrent = 2
# now: core/ollama_semaphore.py::get_ollama_semaphore() -- the ceiling that
# parser/facts should wrap their Ollama calls with (not yet wired; see the
# module docstring) via this semaphore. Initial value 2 (an estimate, a
# conservative start consistent with K-10's "shared" note) — the real 120 s
# threshold should be measured and tuned on the GPU/service machine.

[pipeline.versions]
# N-13: each stage's CURRENT version in ONE place. The nightly report (N-12,
# `nightly_report.py::derive_status`) compares a record's `*_version` with this
# and says "stage changed" if stale. Bumped by hand (the code hash is NOT taken
# automatically — it would mark the whole corpus stale on every refactor and
# drown in noise; see the task text). Bumped on any change that alters a
# stage's OUTPUT (prompt, threshold, chunk limit, parser geometry); not bumped
# on cosmetic/refactor changes.
# EXCEPTION — embedding model: if the model changes the vector dimension can
# change (D-03: measured 4096) and the WHOLE collection becomes invalid; in that
# case bumping the version is NOT ENOUGH, the collection is rebuilt (see RUNBOOK.md).
parser_version = "1.5.0"
# now: pipeline/parser/parsers/base.py -> PARSER_VERSION (the single source of
# truth is still there; this line mirrors it for N-13's "also visible in config")
chunker_version = "1.0.1"
# now: pipeline/chunker/__init__.py -> CHUNKER_VERSION (same mirror rule)
facts_version = "1.0.0"
# NEW (N-13) — the facts layer was never versioned until revived by the O group.
# Initial value 1.0.0; the first writer produced by the O group must record this
# version (see the nightly_report.py N-12/N-13 note, work left out of scope).
vectorize_version = "1.0.0"
# NEW (N-13) — the version of the vectorize STAGE (payload shape, signature
# computation logic), NOT the embedding model. Model change is a separate
# exception (see above).
