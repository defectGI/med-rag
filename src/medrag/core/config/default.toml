# core/config — cross-cutting tuning skeleton (D-51).
#
# WHAT IT IS NOT: this file does NOT REPLACE `parser/config/default.toml`,
# `chunker/config/default.toml`, `vectorize/config/default.toml`,
# `api/config/default.toml`, and does NOT MERGE them. CONFIG.md's rule
# "each component carries its own config/default.toml; there is no shared
# config package" still holds — components deliberately do not import each
# other, and a single dev TOML would break that isolation.
#
# WHAT IT IS: the settings that `ANALYSIS.md` §2.5 found have NO home in any
# component's own config/default.toml — either a bare `os.getenv(...)`
# fallback or an in-code literal. Before D-56 ("single read point: os.getenv
# only inside core/config/") it was written to make these visible/discussable
# in ONE place.
#
# This round (D-51) is only the SKELETON: the values are a verbatim copy of
# today's in-code/env fallbacks; the code does NOT READ this file yet (that is
# the loader D-52/D-56's job). The aim is to gather the lost-setting inventory
# in one place, not to change behavior.
#
# DELIBERATE EXEMPTION: the geometry/threshold constants in
# `parser/parsers/pdf_parser.py` and its siblings (K-56/D-57 decision,
# untouched this round) — not included here.

[retrieval]
# `src/medrag/api/retrieval/` today carries NO TOML loader — each module keeps
# its own `os.getenv(...)` fallback inline (consistent with CONFIG.md's
# "retrieval has no TOML loader" note, ANALYSIS.md §2.5).
# Source: modules/intent_classification/factory.py, modules/top_n/embedder.py.
llm_timeout_seconds = 60
# now: intent_classification/factory.py:86 -> os.getenv("LLM_TIMEOUT", "60")
llm_max_retries = 2
# now: intent_classification/factory.py:87 -> os.getenv("LLM_MAX_RETRIES", "2")
embedder_timeout_seconds = 120.0
# now: modules/top_n/embedder.py:67 -> constant default in the function
# signature (NOT from env, directly a Python default)

[chunking]
