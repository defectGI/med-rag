# ACME spec key dictionary -- GENERATED, DO NOT HAND-EDIT.
#
# Source: attribute_schema_v3.json   Generator: scripts/build_spec_keys.py
# Edits go there, not here; this file is overwritten on every build.
#
# This dictionary maps 1:1 onto layer 3 (ATTRIBUTE DICTIONARY) of schema.sql:
#   blocks[]                -> attribute_block
#   attributes[]            -> attribute (question/kind/unit/evidence)
#   attributes[].labels     -> attribute_label     (R1.5: label does NOT enter the name)
#   attributes[].conditions -> attribute_condition (R1.2/R1.3: condition does NOT enter the name)
#   attributes[].subfields  -> attribute_subfield  (R2.3: accuracy/resolution does NOT
#                              open their own key -- they hang off the parent quantity)
#   blocks[].applies_to     -> attribute_applicability
#
# SCOPE: `applies_to` lives at the BLOCK level and is the family / subfamily
# NAME from product_nodes.json (verbatim; the generator validates every build
# and aborts on drift). `core` has empty scope = applies to every family.
#
# `unit` is the canonical unit; each value row also carries its own
# `unit_observed`. `kind` is SINGLE: a document's presentation difference
# (4-column min|typ|max vs a single cell) is NOT a second kind -- the
# parser normalizes it.

version: 2.0.0
source: attribute_schema_v3.json (v3.1)
generated_by: scripts/build_spec_keys.py
ruleset: attribute_rules.txt (R0.1-R0.4, R1.1-R1.6, R2.1-R2.5, R3.1-R3.7)
ruleset_exceptions:
- rule: R3.1
  exception: a component SELECTED as part of the product's configuration is not BOM
  decided: '2026-08-03'
  applies_to_keys:
  - processor_model
  - fpga_model
  reason: 'R3.1 excludes IC component manufacturer / MPN (capacitor, regulator: customers don''t ask, doesn''t distinguish products). Processor and FPGA differ: customers
    ask directly (''is there an i7 option?'') and it''s a CONFIGURATION choice that distinguishes products -- both R0.1 and R0.4 are strong (6 and 3 distinct values).
    The exception is NARROW: only customer-selectable configuration components, not every IC on the board. Not a closed vocabulary, but a normalized string.'
kinds:
- single
- min_typ_max
- range
- list
- conditional
- boolean
statuses:
  present: Value is explicitly written in the document.
  not_specified: Key applies to this product but the document gives no value.
  absent: Document explicitly states the ABSENCE of the feature ('Not terminated', 'Non-isolated'). Never generated by inference.
  conflicting: Two documents give different values for the same product (e.g. brochure says 2 kg, user manual says 2100 g). With 772 documents / 250 products and
    spec tables that repeat per doc_type, this is unavoidable; if it were hidden under 'present' the chatbot would randomly pick one answer. Separate status until
    a fix exists.
  superseded: A newer document (document_nodes.scan.last_modified_time / doc revision) invalidated the value for the same product. Old value is not deleted, it is
    dropped from retrieval.
  not_applicable: 'Key is NEVER valid for this product''s family/subfamily -- the question is not asked of this product. NOT `absent`: applies_to derives from observation
    and is deliberately narrow, ''I didn''t observe it'' != ''it doesn''t exist''. This status is required because the (model x key) matrix is pre-generated; the
    bootstrap writer writes it, the fact flow never does.'
