# Text-to-SQL linking schema for the LEGACY spec store
# (C:\path\to\data\specs.db) -- hand-written for a one-off local
# smoke test (2026-08-03), NOT generated by facts/build_schema.py. This is a
# different, older 3-table schema than facts/db/schema.yaml's current 6-table
# EAV rebuild (which has zero `present` spec values right now -- see
# facts/db/legacy_comparison_2026-07-31_13-10-51.md). This legacy DB is the
# only one with real, filled-in spec values today (1176 present rows across
# 70 products / 430 keys), which is why the user asked to point the bot at it
# for a first "does this feel right" conversation.
name: acme_spec_store_legacy
tables:
- name: product
  description: |-
    Product catalog (70 rows). All specs attach to it via `model`, the
    stable identifier. Match a model case-insensitively (UPPER(model)=
    UPPER('de9001') or model LIKE '%de9001%'); match a family loosely with
    LIKE '%PXI%' because users type the short name, not the full upper-case
    string.

    JOIN this table ONLY when the query filters/groups by `family`. To list
    which products have/meet an attribute, spec_value already carries
    `model` -- no join needed.

    FAMILIES (product count): PXI EXPRESS SYSTEMS (21), SIGNAL CONDITIONING
    & SIMULATION SYSTEMS (17), TEST SYSTEM COMPONENTS (9), ETHERNET
    CONTROLLED INSTRUMENTS (LXI) (9), AVIONICS INTERFACES (6), DAQ SYSTEMS
    (4), PCI EXPRESS SYSTEMS (2), NAVIGATION SYSTEM PRODUCTS (1), EMBEDDED
    BOARDS & MODULES (1).
  columns:
  - name: model
    type: TEXT
    primary_key: true
    description: Unique product model code. PK and join key for all specs. Case-insensitive match.
    sample_values: [PN1309, PN1225, PN1106, PN1015, PN1190]
  - name: family
    type: TEXT
    description: Product family (upper-case fixed text). Main grouping/filter axis. Use LIKE '%...%'.
    sample_values: [PXI EXPRESS SYSTEMS, SIGNAL CONDITIONING & SIMULATION SYSTEMS, TEST SYSTEM COMPONENTS, ETHERNET CONTROLLED INSTRUMENTS (LXI), AVIONICS INTERFACES]
  - name: title
    type: TEXT
    description: Human-readable product name. Almost always NULL in this legacy DB -- fall back to `model` for a NAME answer. Do not use in WHERE (match on `model`).
  - name: doc_id
    type: TEXT
    description: UUID of the product's source document, provenance only -- never surface to the user.
  - name: source_path
    type: TEXT
    description: 'CRITICAL: internal filesystem path of the source datasheet. NEVER show, print, or quote this to the user -- there is no download endpoint wired to it in this legacy DB, so it must never leak into an answer.'
  foreign_keys: []
- name: spec_key
  description: |-
    Canonical attribute dictionary (METADATA ONLY -- definitions, never an
    actual product value). 430 keys across 11 categories. Use it to (a) map
    a natural-language term to the canonical `key`, and (b) filter by
    `category`. Actual values live in spec_value.

    CATEGORIES (key count; present-value count): io_interface (135 keys;
    255 present), power (133; 295), measurement (73; 121), switching (22;
    100), operational (18; 25), navigation (12; 5), protection (12; 26),
    environmental (10; 249), compute (7; 14), mechanical (5; 72),
    identity (3; 14).

    SCOPE: 74 'shared' keys (one universal definition, e.g.
    operating_temperature, input_voltage) and 356 'family'-specific keys
    (only meaningful for certain families -- e.g. relay/ADC/GPS-specific
    attributes).

    KEY-MAPPING STRATEGY (schema linking): this table's own `description`
    column already carries a rich English gloss + Turkish/English aliases +
    unit/format notes for EVERY key (it was written by hand from the source
    datasheets) -- when the user's term isn't an obvious match, resolve it
    with a subquery instead of guessing, e.g.:
      key IN (SELECT key FROM spec_key WHERE description LIKE '%isolation%')
      key IN (SELECT key FROM spec_key WHERE category = 'switching')
    The `unit` column here is the canonical unit of the attribute; the
    actual stored value in spec_value may carry a DIFFERENT per-record unit
    (see spec_value.unit) -- always compare/report in a consistent unit.
  columns:
  - name: key
    type: TEXT
    primary_key: true
    description: Canonical machine name of the attribute. Target of spec_value.key.
    sample_values: [operating_temperature, input_voltage, bandwidth, contact_resistance, accuracy]
  - name: category
    type: TEXT
    description: One of 11 categories (see table description for counts). Strong filter axis.
    sample_values: [io_interface, power, measurement, switching, environmental, mechanical, operational, navigation, protection, compute, identity]
  - name: expected_kind
    type: TEXT
    description: The value shape this key is EXPECTED to take (compare with spec_value.kind, which is the shape actually observed for a given row).
    sample_values: [single, list, range, boolean, conditional, "single / list", "single / range", "single / min_typ_max"]
  - name: unit
    type: TEXT
    description: Canonical unit of the attribute (may be NULL for unitless/text attributes). Per-record unit in spec_value.unit may differ.
    sample_values: [mA, V, Hz, °C, ppm, bit, mm, "%RH", mΩ]
  - name: scope
    type: TEXT
    description: "'shared' = one universal definition across all families; 'family' = only meaningful for specific product families."
    sample_values: [shared, family]
  - name: description
    type: TEXT
    description: Rich English gloss of the key's meaning, aliases (often bilingual TR/EN), and notes on how the value is typically expressed in the source datasheets. THE primary tool for resolving an ambiguous user term to a key -- search it with LIKE.
  foreign_keys: []
- name: spec_value
  description: |-
    The actual measured/stated specification for one (model, key) pair
    (6901 rows total: 1176 'present', 76 'not_specified', 5649 'absent').
    This is the EAV fact table -- almost every real question ("what is the
    operating temperature of PN1309") is answered from here, joined to
    spec_key only when a category/description lookup is needed to find the
    right `key`.

    STATUS meaning (ALWAYS filter status='present' unless the user
    explicitly asks about missing/unspecified data): 'present' = a real
    value was extracted; 'not_specified' = the datasheet does not state
    this attribute for this product (a valid, expected answer -- do not
    imply an error); 'absent' = this key does not apply to this product's
    family at all (most rows -- most keys are family-specific and every
    product carries a placeholder row for every key in the dictionary).

    VALUE SHAPE -- exactly one group of value_* columns is populated,
    matching `kind`:
      single       -> value_num (numeric) or value_text (non-numeric)
      range        -> value_from, value_to (e.g. operating_temperature 0-40°C)
      min_typ_max  -> value_min, value_typ, value_max (any subset may be NULL)
      boolean      -> value_bool (0/1)
      list         -> value_text (a delimited/free-text list, not normalized)
      conditional  -> value_text, with the condition itself in `condition`
    `raw` always holds the original datasheet string regardless of kind --
    use it to show/quote the value verbatim if the structured columns look
    ambiguous or incomplete. `unit` here is the PER-RECORD unit actually
    used in this row; it can differ from spec_key.unit (the canonical
    unit) -- do not silently assume they match when comparing/sorting
    across products.
  columns:
  - name: id
    type: INTEGER
    primary_key: true
    description: Surrogate row id, no semantic meaning.
  - name: model
    type: TEXT
    description: Which product this value belongs to (FK -> product.model).
    sample_values: [PN1309, PN1015, PN1106]
  - name: key
    type: TEXT
    description: Which attribute this value is for (FK -> spec_key.key).
    sample_values: [operating_temperature, bandwidth, contact_resistance]
  - name: status
    type: TEXT
    description: "'present' (real value, filter to this for normal questions), 'not_specified' (datasheet omits it), 'absent' (key doesn't apply to this product's family)."
    sample_values: [present, not_specified, absent]
  - name: kind
    type: TEXT
    description: Which value_* column group is populated for this row (NULL when status != 'present'). See table description for the mapping.
    sample_values: [single, range, min_typ_max, boolean, list, conditional]
  - name: value_num
    type: REAL
    description: Populated only when kind='single' and the value is numeric.
  - name: value_min
    type: REAL
    description: Populated only when kind='min_typ_max'.
  - name: value_typ
    type: REAL
    description: Populated only when kind='min_typ_max'.
  - name: value_max
    type: REAL
    description: Populated only when kind='min_typ_max'.
  - name: value_from
    type: REAL
    description: Populated only when kind='range' (lower bound).
  - name: value_to
    type: REAL
    description: Populated only when kind='range' (upper bound).
  - name: value_bool
    type: INTEGER
    description: Populated only when kind='boolean' (0/1).
  - name: value_text
    type: TEXT
    description: Populated when kind is 'single' (non-numeric), 'list', or 'conditional'.
  - name: unit
    type: TEXT
    description: Per-record unit actually used in the source datasheet for this row -- may differ from spec_key.unit (the canonical unit).
    sample_values: [MHz, mΩ, °C, "%", V]
  - name: condition
    type: TEXT
    description: Free-text qualifier for the value (e.g. a test condition, which rail/mode it applies to). Populated mainly for kind='conditional' but can appear elsewhere too.
  - name: raw
    type: TEXT
    description: Original datasheet string this row was extracted from, verbatim. Use to quote/display the value as written if the structured columns are ambiguous.
  foreign_keys:
  - column: model
    references_table: product
    references_column: model
  - column: key
    references_table: spec_key
    references_column: key
