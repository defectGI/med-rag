# ACME Spec Store schema -- MODEL-FACING PROJECTION.
# GENERATED by facts/facts/build_schema.py; do not hand-edit.
# This is the file text2sql's SCHEMA_PATH points at. It is schema.yaml
# minus the columns the model has no business querying (provenance /
# internal bookkeeping) and minus attribute_glossary. Citation columns
# are added to the generated SQL in code -- see
# chatbot/chatbot/sql_citation.py. The FULL schema.yaml stays the
# source of truth and still carries every column.
name: acme_spec_store
tables:
- name: spec_value
  description: |-
    PRIMARY ANSWER SURFACE (24389 rows) -- start here for almost every
    product-spec question. One row = one product's stated fact for one attribute.
    `family`/`subfamily`/`unit`/`source_file_name` are ALREADY joined in (denormalized
    at write time) -- for the common case you need ONLY THIS TABLE, no JOIN at all.
    Join `product` only if you need price/display_name/variant info.

    STATUS -- filtering on this is critical:
      present (2737) -- the document states a value. THE answer.
      absent (19) -- the document EXPLICITLY declares the feature missing
        ("Not terminated"). A real, citable answer: "no, it does not have it".
      not_specified (4670) -- the attribute applies to this product but no
        value was found (yet). NOT an answer. Means "we don't know", never "it has none".
      not_applicable (16609) -- the attribute is not scoped to this product's
        family, so the question is not asked here. A statement about the DICTIONARY's
        coverage, NOT about the product. NEVER report it as "the product lacks this".
      conflicting (354) -- two documents disagree on the value; BOTH rows
        are kept (one per disagreeing value) instead of picking one silently.
      superseded -- a newer document overrode this value; kept for history, not a
        current answer.
    => Almost every real query needs status = 'present' (add 'absent' when the user
       asks whether a feature exists at all).

    KIND -> which typed slot holds the number:
      single (1112): num_value (numeric) OR text_value (enum/string)
      min_typ_max (192): val_min / val_typ / val_max
      range (641): val_min / val_max (an interval; only the endpoints exist)
      boolean (150): bool_value (1=Yes, 0=No)
      list (393): items -- a JSON array text column, e.g.
        '[{"item_code":"rs485","item_text":"RS-485"}, ...]'. Filter with
        `items LIKE '%rs485%'`; DISPLAY `raw_text` (verbatim) instead of parsing JSON.
      conditional (249): num_value/text_value plus `condition`
        (a plain qualifier string, e.g. 'ethernet', 'analog_in' -- NOT a foreign key,
        just match it as text: `condition = 'ethernet'`)

    NUMERIC COMPARISON -- use the typed slots, never LIKE on a number. The exact kind
    is usually unknown at query time, so cover both shapes with COALESCE:
      supported AT point X:   val_min <= X AND val_max >= X
      at least X:             COALESCE(val_max, num_value) >= X
      at most X:              COALESCE(val_min, num_value) <= X
      exactly X:              COALESCE(num_value, val_typ) = X

    UNIT NORMALIZATION (avoids silent wrong answers): `unit_observed` is the unit as
    WRITTEN in that document and can differ between rows of the same key (mA vs A).
    `unit` (this table's own column) is the canonical unit. Before comparing a user's
    number, SCALE rows to one unit -- do NOT just add `AND unit_observed='mA'`, that
    silently drops the rows recorded in A (12 A = 12000 mA is above 199 mA but would
    be excluded):
      CASE WHEN unit_observed='A' THEN COALESCE(val_max,num_value)*1000
           ELSE COALESCE(val_max,num_value) END > 199

    DISPLAY vs FILTER: return `raw_text` for a human-readable answer (it is the
    authority); use the typed slots only for numeric comparison. If they disagree,
    raw_text wins.
  columns:
  - name: value_id
    type: INTEGER
    primary_key: true
    description: Auto row id.
  - name: product_code
    type: TEXT
    description: Product code the user types. Match case-insensitively. FK -> product.
    sample_values:
    - PN1015
    - PN1029
    - PN1036
    - PN1043
    - PN1050
  - name: family
    type: TEXT
    description: Product family (denormalized from `product`). Match loosely with LIKE '%PXI%'.
    sample_values:
    - AVIONICS INTERFACES
    - DAQ SYSTEMS
    - EMBEDDED BOARDS & MODULES
    - ETHERNET CONTROLLED INSTRUMENTS (LXI)
    - FMC MODULES
  - name: subfamily
    type: TEXT
    description: Finer grouping. May be NULL.
  - name: block
    type: TEXT
    description: Attribute block the key belongs to. Disambiguates a key name that exists in several blocks.
    sample_values:
    - analog_io
    - avionics_bus
    - battery_simulator
    - chassis_controller
    - core
  - name: key
    type: TEXT
    description: Canonical attribute name. Map the user's words to this (see the `attribute` table).
    sample_values:
    - amplifier_operating_voltage
    - analog_input_voltage
    - analog_output_voltage
    - apparent_power
    - backplane_bandwidth
  - name: kind
    type: TEXT
    description: Value shape; tells you which typed slot below is filled (denormalized from `attribute`).
    sample_values:
    - single
    - min_typ_max
    - range
    - list
    - conditional
    - boolean
  - name: unit
    type: TEXT
    description: CANONICAL unit of the attribute (denormalized from `attribute`). The row's own unit is `unit_observed` and may differ.
    sample_values:
    - '%RH'
    - A
    - C
    - GB
    - GB/s
  - name: condition
    type: TEXT
    description: Plain-text qualifier the value holds under ('ethernet', 'analog_in'), or NULL. NOT a foreign key -- match as text.
  - name: status
    type: TEXT
    description: present / absent / not_specified / not_applicable / conflicting / superseded. See the table description.
    sample_values:
    - present
    - absent
    - not_specified
    - not_applicable
    - conflicting
    - superseded
  - name: num_value
    type: NUMERIC
    description: Single numeric value (kind=single).
  - name: text_value
    type: TEXT
    description: Single textual/enum value (kind=single).
  - name: val_min
    type: NUMERIC
    description: Interval start / minimum (kind=range or min_typ_max).
  - name: val_typ
    type: NUMERIC
    description: Typical value (kind=min_typ_max).
  - name: val_max
    type: NUMERIC
    description: Interval end / maximum (kind=range or min_typ_max).
  - name: bool_value
    type: INTEGER
    description: 'Boolean value (kind=boolean): 1=Yes, 0=No.'
  - name: items
    type: TEXT
    description: 'JSON array (kind=list ONLY): [{"ordinal":1,"item_code":"rs485","item_text":"RS-485"}, ...]. Filter with LIKE, DISPLAY raw_text instead.'
  - name: subfields
    type: TEXT
    description: 'JSON array: [{"name":"accuracy","num_value":...,"unit_observed":...,"raw_text":...}]. Rare -- most keys have none.'
  - name: unit_observed
    type: TEXT
    description: Unit as written in THIS document. Can differ between rows of the same key -- scale before comparing.
    sample_values:
    - V
    - mA
    - A
    - g
    - VA
  - name: raw_text
    type: TEXT
    description: Verbatim source text. AUTHORITATIVE -- return this for a human-readable answer.
  foreign_keys:
  - column: product_code
    references_table: product
    references_column: product_code
- name: attribute
  description: |-
    THE ATTRIBUTE DICTIONARY (95 attributes across 10 blocks --
    METADATA ONLY, it defines what an attribute IS, it never holds a product's
    value). Use it to (a) map a natural-language term to the canonical `key`
    (via the `labels` JSON array: label strings actually observed in the source
    documents), and (b) read the canonical `unit`/`kind`.

    KEY-MAPPING STRATEGY (do this instead of guessing a key name):
    1. Try the CORE GLOSSARY below (asked of every product).
    2. Otherwise resolve AT QUERY TIME with a subquery rather than inventing a name:
         key IN (SELECT key FROM attribute WHERE key LIKE '%relay%')
         key IN (SELECT key FROM attribute WHERE labels LIKE '%output current%')

    THE SAME KEY NAME CAN EXIST IN SEVERAL BLOCKS (`channel_count` lives separately
    in analog_io, digital_io and battery_simulator). UNIQUE is (block, key), NOT
    key alone -- `spec_value.block` disambiguates when needed, otherwise a plain
    `WHERE key = '...'` (without a block filter) already covers every block, which
    is usually what you want.

    BLOCKS (key count; which families the block is scoped to):
      core (19 keys): every product, no scope restriction.
      analog_io (15 keys): DAQ SYSTEMS; SIGNAL CONDITIONING & SIMULATION SYSTEMS; PXI EXPRESS SYSTEMS / PXI Express Systems DAQ and DMM Modules; ETHERNET CONTROLLED INSTRUMENTS (LXI) / LXI Data Acquisition and Simulation Systems
      switching_relay (13 keys): PXI EXPRESS SYSTEMS / PXI Express Systems Switches and Multiplexers; PXI EXPRESS SYSTEMS / PXI Express Systems RF Switch and Mux Modules; ETHERNET CONTROLLED INSTRUMENTS (LXI) / LXI Switches and Multiplexers
      embedded_compute (10 keys): EMBEDDED BOARDS & MODULES; FMC MODULES; PXI EXPRESS SYSTEMS / PXI Express Systems Chassis and Controllers; PXI EXPRESS SYSTEMS / PXI Express Systems AI and Robotics Modules
      chassis_controller (8 keys): PXI EXPRESS SYSTEMS / PXI Express Systems Chassis and Controllers; ETHERNET CONTROLLED INSTRUMENTS (LXI) / LXI Mainframes
      digital_io (7 keys): PXI EXPRESS SYSTEMS / PXI Express Systems Digital I/O and FPGA Modules; DAQ SYSTEMS; SIGNAL CONDITIONING & SIMULATION SYSTEMS
      mil_std_1553_coupler (7 keys): MIL-STD-1553 BUS COUPLERS
      power_distribution (6 keys): TEST SYSTEM COMPONENTS / PDU Products
      battery_simulator (5 keys): SIGNAL CONDITIONING & SIMULATION SYSTEMS / Battery Simulators
      avionics_bus (5 keys): AVIONICS INTERFACES; NAVIGATION SYSTEM PRODUCTS

    CORE GLOSSARY (key (kind; canonical unit): the customer question it answers):
      compliance_standards (list): MIL-STD-461 uyumlu mu? RoHS belgesi var mi? LXI hangi surum? Titresim hangi standarda gore test edilmis?
      connector_types (list): On panelde hangi konnektor var?
      cooling_method (single; enum: forced_air|internal_fan|natural_convection): Fanli mi, pasif mi sogutuluyor?
      data_rate (single; Mbps): Ethernet hizi gigabit mi? RS-485 kac baud'a cikar?
      dimensions (single; mm): Rafima sigar mi, olculeri ne?
      has_ce_declaration (boolean): CE beyani (CE Declaration of Conformity) var mi?
      ingress_protection (single): Toz/su korumasi var mi, IP65 mi?
      interfaces (list): CAN arayuzu var mi? SFP+ portu var mi?
      operating_humidity (range; %RH): Nem toleransi ne kadar?
      operating_temperature (range; C): -40 derecede calisir mi?
      port_count (conditional): Kac tane seri port var? Kac USB portu var?
      power_consumption (min_typ_max; W): Ne kadar guc harciyor?
      rack_units (single; U): Kac U yer kaplar, 1U raf yuvama sigar mi?
      shock_rating (single; g): Kac G soka dayanir?
      storage_humidity (range; %RH): Depoda nem siniri var mi?
      storage_temperature (range; C): Depolama sicaklik araligi ne?
      supply_current (min_typ_max; A): Sebekeden kac amper ceker, sigortam yeter mi?
      supply_voltage (min_typ_max; V): 24 V ile besleyebilir miyim?
      weight (single; g): Agirligi ne kadar, kac kilo?

    EXAMPLE FAMILY-BLOCK KEYS (not exhaustive -- use LIKE/labels to reach the rest):
      analog_io: analog_input_voltage (+-10 V girisi olcebilir mi? Hangi kademeler var?), analog_output_voltage (Cikis gerilimi kac volta kadar cikiyor?), bandwidth (Bant genisligi kac kHz?), channel_count (Kac analog giris kanali var? Diferansiyel modda kac kanal kaliyor?), crosstalk (Kanallar arasi diafoni ne kadar?)
      avionics_bus: bus_channel_count (Kac kanal MIL-STD-1553 var? ARINC-429'da kac TX kac RX?), bus_redundancy (Dual-redundant mi?), irig_b_input_amplitude (IRIG-B sinyalini kac volttan cozer?), video_channel_count (Kac video girisi/cikisi var?), video_signal_standard (Kompozit video mu, YPbPr mi?)
      battery_simulator: amplifier_operating_voltage (Amplifikator besleme araligi ne?), channel_count (Kac hucre kanali var?), isolation_voltage (Kanallar arasi izolasyon kac volt?), output_current (Kanal basina kac mA kaynak/yuk olabilir?), output_voltage (Hucre basina kac volta kadar simule eder?)
      chassis_controller: backplane_bandwidth (Backplane veri yolu kac GB/s?), operating_system (Linux destekliyor mu? VxWorks surucusu var mi?), pxie_slot_width (Modul kac yuva genisliginde?), reference_clock_frequency (10 MHz referans saat cikisi var mi?), slot_cooling_capacity (Yuva basina kac watt sogutabiliyor?)
      digital_io: bit_count (Toplam kac bitlik dijital G/C var?), channel_count (Kac dijital I/O kanali var?), esd_protection (ESD korumasi kac kV?), input_logic_threshold (TTL mi 3.3 V mi giris seviyesi kabul ediyor?), output_drive_current (Kanal basina kac mA surebilir?)
      embedded_compute: cache_size (Ne kadar onbellek var?), core_count (Kac cekirdekli?), cpu_clock (Saat hizi kac GHz'e cikiyor?), fmc_connector_type (FMC LPC mi HPC mi?), fpga_model (Hangi FPGA var?), pcie_generation (PCIe Gen3 mu Gen4 mu?; enum: gen1|gen2|gen3|gen4|gen5)
      mil_std_1553_coupler: characteristic_impedance (Hat empedansi 78 ohm mu?), fault_protection_resistance (Ariza koruma direnci kac ohm?), stub_count (Kac stub'li coupler lazim, 4 mu 8 mi?), stub_resistor_value (Stub direnci kac ohm?), termination_resistor_value (Sonlandirma direnci kac ohm?), termination_type (Sonlandirmali mi (terminated), hangi tip?; enum: dtrm|ltrm|rtrm|non_terminated)
      power_distribution: apparent_power (Toplam kac VA yuk besleyebilir? Gorunur guc kapasitesi ne?), outlet_count (Kac prizi var?), output_current (Priz basina kac amper cekebilirim?), overcurrent_protection (Sigorta kac amper?), phase_count (Tek fazli mi uc fazli mi?)
      switching_relay: bandwidth (RF anahtarin bant genisligi ne?), characteristic_impedance (Hat empedansi 50 ohm mu?), contact_resistance (Kontak direnci kac miliohm?), relay_contact_material (Kontak malzemesi ne, dusuk seviye sinyalde guvenilir mi?), relay_endurance (Role kac cevrim dayanir?)

    `conditions`/`subfields`/`applies_to` are JSON arrays -- REFERENCE ONLY (not a
    closed/enforced vocabulary at the DB level): what qualifier codes/subfield
    names/family scopes have been observed for this key. `enum_values`/
    `accepts_units` are JSON arrays or NULL.
  columns:
  - name: block
    type: TEXT
    description: Which block this key belongs to.
    sample_values:
    - analog_io
    - avionics_bus
    - battery_simulator
    - chassis_controller
    - core
  - name: key
    type: TEXT
    description: Canonical machine name.
    sample_values:
    - amplifier_operating_voltage
    - analog_input_voltage
    - analog_output_voltage
    - apparent_power
    - backplane_bandwidth
  - name: kind
    type: TEXT
    description: The value shape of this attribute.
    sample_values:
    - single
    - min_typ_max
    - range
    - list
    - conditional
    - boolean
  - name: unit
    type: TEXT
    description: Canonical unit.
    sample_values:
    - '%RH'
    - A
    - C
    - GB
    - GB/s
  - name: enum_values
    type: TEXT
    description: JSON array of the closed value vocabulary, when the attribute has one. NULL otherwise.
  - name: accepts_units
    type: TEXT
    description: JSON array of units that belong to THIS attribute when a label is shared with another one.
  - name: labels
    type: TEXT
    description: 'JSON array: label strings actually observed in the source documents -- the best bridge from a datasheet word to this key.'
  - name: conditions
    type: TEXT
    description: 'JSON array: qualifier codes observed for this key (reference only, not DB-enforced).'
  - name: subfields
    type: TEXT
    description: 'JSON array: [{"name":...,"unit":...}] sub-quantities (accuracy/resolution) attached to this key.'
  - name: applies_to
    type: TEXT
    description: JSON array of family/subfamily scope names this key has been observed in (guidance, not a hard filter).
  - name: is_core
    type: INTEGER
    description: 1 = asked of every product regardless of family.
  - name: is_active
    type: INTEGER
    description: 1 = live dictionary entry.
  foreign_keys: []
- name: product
  description: |-
    Product catalog (249 products) -- identity and COMMERCIAL data.
    `product_code` ('PN1309') is what users type; match it case-insensitively
    (UPPER(product_code)=UPPER('de9001')).

    Price lives HERE, never in `spec_value`. Three distinct price states -- do
    not collapse them:
      list_price IS NOT NULL      -> a real price (172 of 249 products)
      price_on_request = 1        -> "price on request"
      both empty                  -> the registry simply has NO price. Say it is not
                                     recorded; do NOT say "contact us for pricing",
                                     that is what price_on_request means.

    `display_name` is the human-readable name -- prefer it when the user asks for a
    product's NAME; `product_code` remains the identifier.

    FAMILIES (12 values of `family`; product count; present-value count):
      MIL-STD-1553 BUS COUPLERS (103 products; 885 present values)
      TEST SYSTEM COMPONENTS (31 products; 182 present values)
      PXI EXPRESS SYSTEMS (30 products; 490 present values)
      AVIONICS INTERFACES (29 products; 573 present values)
      SIGNAL CONDITIONING & SIMULATION SYSTEMS (24 products; 308 present values)
      EMBEDDED BOARDS & MODULES (13 products; 18 present values)
      ETHERNET CONTROLLED INSTRUMENTS (LXI) (9 products; 186 present values)
      DAQ SYSTEMS (4 products; 39 present values)
      SOFTWARE PRODUCTS (2 products; 1 present values)
      PCI Express Systems (2 products; 36 present values)
      NAVIGATION SYSTEM PRODUCTS (1 products; 17 present values)
      FMC MODULES (1 products; 2 present values)
  columns:
  - name: product_code
    type: TEXT
    primary_key: true
    description: The code users type ('PN1309'). Match case-insensitively.
    sample_values:
    - PN1015
    - PN1029
    - PN1036
    - PN1043
    - PN1050
  - name: display_name
    type: TEXT
    description: Human-readable product name. Prefer it for a NAME answer; never invent one.
  - name: family
    type: TEXT
    description: Product family.
    sample_values:
    - AVIONICS INTERFACES
    - DAQ SYSTEMS
    - EMBEDDED BOARDS & MODULES
    - ETHERNET CONTROLLED INSTRUMENTS (LXI)
    - FMC MODULES
  - name: subfamily
    type: TEXT
    description: Finer grouping. May be NULL.
  - name: subfamily_2
    type: TEXT
    description: Third taxonomy level. May be NULL.
  - name: acme_code
    type: TEXT
    description: Internal ACME order code. Rarely user-facing.
  - name: list_price
    type: NUMERIC
    description: Catalogue price. NULL means the price is not in the registry (see the table description).
  - name: price_on_request
    type: INTEGER
    description: 1 = price is deliberately 'on request'. Only THEN say 'contact us for pricing'.
  - name: valid_until
    type: TEXT
    description: ISO date the price is valid until.
  - name: price_break_10_99
    type: NUMERIC
    description: Unit price for a 10-99 order.
  - name: price_break_100_499
    type: NUMERIC
    description: Unit price for a 100-499 order.
  - name: price_break_500_999
    type: NUMERIC
    description: Unit price for a 500-999 order.
  - name: is_variant
    type: INTEGER
    description: 1 = this product is a variant of another.
  - name: variant_base
    type: TEXT
    description: product_code of the base product when is_variant=1.
  foreign_keys: []
- name: v_document_product
  description: |-
    Downloadable files per product (1512 (file, product) pairs) --
    USE THIS instead of `document` whenever the question is "what files does
    product X have". One product can have many files (brochure, datasheet, CE
    declaration, technical drawing, STP/CAD, user manual, product images). Answer
    with `file_name` and `doc_type`. Filter is_active = 1 unless the user
    explicitly wants historical files.

    DOC_TYPE COUNTS: PRODUCT_IMAGE (531), DATASHEET (71), BROCHURE (55), TECHNICAL_DRAWING (50), STP (43), CE_DECLARATION (8), CATALOGUE (8), USER_MANUAL (5), QUICK_START_GUIDE (1).

    `trust_rank` orders sources when two documents disagree (DATASHEET 100 > USER_MANUAL
    90 > CE_DECLARATION 85 > TECHNICAL_DRAWING 80 > CATALOGUE 60 > BROCHURE 50).
  columns:
  - name: doc_id
    type: TEXT
    description: Stable id of the file. Used by the download endpoint.
    sample_values:
    - 003d6dc1-a5fb-406c-9ac2-6f0b53168892
    - 00a7966f-2f72-49ef-bfbe-7fe926f5e9ac
  - name: product_code
    type: TEXT
    description: Product code that owns (or inherits) this file.
    sample_values:
    - PN1015
    - PN1029
    - PN1036
    - PN1043
    - PN1050
  - name: doc_type
    type: TEXT
    description: Kind of file.
    sample_values:
    - PRODUCT_IMAGE
    - DATASHEET
    - BROCHURE
    - TECHNICAL_DRAWING
    - STP
    - CE_DECLARATION
    - CATALOGUE
    - USER_MANUAL
    - QUICK_START_GUIDE
  - name: file_name
    type: TEXT
    description: Original file name. SAFE to show -- this is what a user-facing answer displays.
    sample_values:
    - PN5008_07.png
    - PN5113_2.png
    - PN5057_06.png
    - PN5050_01.png
    - PN5099_01.png
  - name: is_active
    type: INTEGER
    description: 1 = current file, 0 = superseded but kept. Filter is_active=1 by default.
  - name: trust_rank
    type: INTEGER
    description: Source authority for conflict resolution (DATASHEET 100 ... PRODUCT_IMAGE 10).
  foreign_keys:
  - column: doc_id
    references_table: document
    references_column: doc_id
- name: document
  description: |-
    The physical files themselves -- `doc_id` is the PK, one row per file.

    CRITICAL RULE -- NEVER expose `file_path`/`rel_path` to the user. They are
    internal filesystem paths; only a separate download endpoint resolves them by
    `doc_id`. When a user asks "what documents exist for X" or "send me the
    datasheet", answer with `file_name` (and `doc_type`) ONLY.

    `product_codes` is a JSON array (which products this file covers, fan-out
    already resolved) -- prefer `v_document_product` (one row per (file, product)
    pair, already unnested) over parsing this JSON yourself.
  columns:
  - name: doc_id
    type: TEXT
    primary_key: true
    description: PK -- one row per physical file.
    sample_values:
    - 003d6dc1-a5fb-406c-9ac2-6f0b53168892
    - 00a7966f-2f72-49ef-bfbe-7fe926f5e9ac
  - name: file_name
    type: TEXT
    description: Original file name. SAFE to show.
    sample_values:
    - PN5008_07.png
    - PN5113_2.png
    - PN5057_06.png
    - PN5050_01.png
    - PN5099_01.png
  - name: doc_type
    type: TEXT
    description: Kind of file.
    sample_values:
    - PRODUCT_IMAGE
    - DATASHEET
    - BROCHURE
    - TECHNICAL_DRAWING
    - STP
    - CE_DECLARATION
    - CATALOGUE
    - USER_MANUAL
    - QUICK_START_GUIDE
  - name: is_active
    type: INTEGER
    description: 1 = current, 0 = superseded/historical.
  - name: trust_rank
    type: INTEGER
    description: Source authority for conflict resolution.
  - name: product_codes
    type: TEXT
    description: INTERNAL JSON array (fan-out already resolved) -- prefer `v_document_product` over reading this directly.
  foreign_keys: []
- name: v_coverage_gap
  description: |-
    The questions a product still CANNOT answer (its `not_specified` rows). Use it
    to say honestly "the datasheet does not state this" instead of guessing, and
    to drive the extraction backlog.

    `not_applicable` rows are deliberately EXCLUDED: that question is never asked of
    this product, so it is not a gap.
  columns:
  - name: product_code
    type: TEXT
    description: Product code.
    sample_values:
    - PN1015
    - PN1029
    - PN1036
    - PN1043
    - PN1050
  - name: family
    type: TEXT
    description: Product family.
    sample_values:
    - AVIONICS INTERFACES
    - DAQ SYSTEMS
    - EMBEDDED BOARDS & MODULES
    - ETHERNET CONTROLLED INSTRUMENTS (LXI)
    - FMC MODULES
  - name: block
    type: TEXT
    description: Attribute block.
    sample_values:
    - analog_io
    - avionics_bus
    - battery_simulator
    - chassis_controller
    - core
  - name: key
    type: TEXT
    description: The attribute that has no value yet.
    sample_values:
    - amplifier_operating_voltage
    - analog_input_voltage
