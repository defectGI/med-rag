# document_info scan/classification tuning.
#
# Type split (root CONFIG.md): this file (TOML) holds the knobs of the scan
# behavior — which files are skipped, which keyword maps to which doc_type,
# the product-code pattern, which extension counts as image/STP. These are
# BEHAVIOR values that can vary per corpus (new doc_type, new exclude pattern),
# so they are not embedded in code.
#   * Paths (PRODUCT_INFO_DIR/BELGELER_DIR/OUTPUT_PATH) are NOT HERE — .env.
#   * No secrets (this script uses no model/network).
#
# Principle (chunker pattern): no default in code — if a key is removed from
# here loading fails loudly; unknown keys are rejected. Override: if the
# `DOCUMENT_INFO_CONFIG` env points to a partial TOML it is merged on top.

[scan]
# Folder names fully skipped during os.walk (its subtree is never entered).
exclude_dir_names = [".TEKNIK DOSYALAR"]
# A file whose name (uppercased) CONTAINS any of these is skipped.
exclude_file_keywords = ["REVISION_HISTORY", "REVISION HISTORY"]
# Files starting with these prefixes are junk (Office lock files, hidden ones).
junk_prefixes = ["~$", "."]
# Files whose full name (lowercased) is in this list are junk.
junk_names = ["thumbs.db"]
# Extensions (lowercase, dot included) counted as images → doc_type PRODUCT_IMAGE.
image_extensions = [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tif", ".tiff", ".webp"]
# CAD/STP extensions (lowercase, dot included) → doc_type STP.
stp_extensions = [".stp", ".step"]

[codes]
# Product-code pattern (Python regex). Tokens matching this pattern in the file
# path are validated against the product_nodes whitelist (tier-1 ownership).
pattern = "DE[\\dX]{3,8}(?:-\\d+)?"

# doc_type keyword table. ORDER MATTERS — once the file name (uppercase) contains
# one of the keywords of the FIRST matching type, that type is assigned
# (top to bottom). If none match, the STP/image extension check runs, and if
# that also fails doc_type = null.
[[doc_types]]
type = "CE_DECLARATION"
keywords = ["CE_DECLARATION", "CE DECLARATION", "DECLARATION"]
[[doc_types]]
type = "TECHNICAL_DRAWING"
keywords = ["TECHNICAL_DRAWING", "TECHNICAL DRAWING", "TECH_DRAWING"]
[[doc_types]]
type = "QUICK_START_GUIDE"
keywords = ["QUICK_START", "QUICK START", "QSG"]
[[doc_types]]
type = "USER_MANUAL"
keywords = ["USER_MANUAL", "USER MANUAL", "MANUAL"]
[[doc_types]]
type = "DATASHEET"
keywords = ["DATASHEET", "DATA_SHEET", "DATA SHEET"]
[[doc_types]]
type = "BROCHURE"
keywords = ["BROCHURE"]
[[doc_types]]
type = "CATALOGUE"
keywords = ["CATALOGUE", "CATALOG"]
